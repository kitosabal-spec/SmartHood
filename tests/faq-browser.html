<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SmartHood FAQ browser checks</title>
<style>body { font: 16px system-ui; } iframe { display: block; height: 800px; margin: 12px 0; border: 1px solid #888; }</style>
<h1>FAQ browser checks</h1>
<p>Uses the actual modal markup and styles, with isolated landing and portal fixtures. No application records are changed.</p>
<pre id="results">Running…</pre>
<script>
(async () => {
  const source = await (await fetch('/index.html')).text();
  const parsed = new DOMParser().parseFromString(source, 'text/html');
  const modal = parsed.getElementById('publicFAQModal').outerHTML;
  const trigger = parsed.getElementById('publicFAQButton').outerHTML;
  const icons = ['ico-help', 'ico-x', 'ico-mail'].map(id => parsed.getElementById(id).outerHTML).join('');
  const results = [];
  for (const theme of ['light', 'dark']) {
    for (const width of [320, 375, 768, 1440]) {
      const frame = document.createElement('iframe');
      frame.width = width;
      frame.title = `${theme} mode at ${width}px`;
      const done = new Promise(resolve => {
        const listener = event => {
          if (event.source !== frame.contentWindow || event.origin !== location.origin || event.data.type !== 'faq-check') return;
          window.removeEventListener('message', listener);
          results.push(event.data.result);
          document.getElementById('results').textContent = results.join('\n');
          resolve();
        };
        window.addEventListener('message', listener);
      });
      frame.srcdoc = `<!doctype html><html lang="en" data-theme="${theme}">
        <link rel="stylesheet" href="/public/css/style.css">
        <link rel="stylesheet" href="/public/css/landing.css">
        <link rel="stylesheet" href="/public/css/faq.css">
        <body data-test-label="${theme} ${width}px">
          <svg style="display:none">${icons}</svg>
          <div id="landingPage"><div style="height:1800px;padding:32px">Landing page scroll fixture</div>
            <section id="contact" style="height:800px;padding:32px"><h2>Contact Information</h2><a href="#">Contact link</a></section>
            <footer class="pub-footer">Footer links remain reachable above FAQ</footer>${trigger}${modal}
          </div><div id="contentArea" class="hidden"></div>
          <script src="/public/js/faq.js"><\/script>
          <script src="/public/js/search-sliding.js"><\/script>
          <script src="/tests/faq-browser-checks.js"><\/script>`;
      document.body.appendChild(frame);
      await done;
    }
  }
})();
</script>
</html>
